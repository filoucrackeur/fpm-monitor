[package]
name = "fpm-monitor"
version = "1.7.0"
edition = "2021"
rust-version = "1.78"
description = "PHP-FPM pool monitor with a CLI table and an interactive terminal dashboard"
authors = ["fpm-monitor contributors"]
license = "MIT"
repository = "https://github.com/filoucrackeur/fpm-monitor"
homepage = "https://github.com/filoucrackeur/fpm-monitor"
readme = "README.md"
keywords = ["php-fpm", "monitoring", "tui", "process", "observability"]
categories = ["command-line-utilities", "development-tools::profiling", "system"]
# Test-only files must never end up in a published source package.
exclude = ["/hello.php", "/tests"]

[[bin]]
name = "fpm-monitor"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
