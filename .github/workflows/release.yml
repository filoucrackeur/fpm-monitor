name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - os: macos-latest
            target: aarch64-apple-darwin
            zig: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            zig: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig
        if: matrix.zig
        uses: goto-bus-stop/setup-zig@v2
      - name: Set up zig-cc linker
        if: matrix.zig
        run: |
          printf '#!/bin/sh\nexec zig cc "$@"\n' | sudo tee /usr/local/bin/zig-cc > /dev/null
          sudo chmod +x /usr/local/bin/zig-cc
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/stage"
          cd "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release"
          if [ -f fpm-monitor.exe ]; then
            cp fpm-monitor.exe "$GITHUB_WORKSPACE/stage/fpm-monitor-${{ matrix.target }}.exe"
          else
            cp fpm-monitor "$GITHUB_WORKSPACE/stage/fpm-monitor-${{ matrix.target }}"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fpm-monitor-${{ matrix.target }}
          path: stage
          if-no-files-found: error

  package:
    name: Package (deb/rpm, ${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: fpm-monitor-${{ matrix.target }}
          path: build
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Generate nfpm config
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -e "s/__ARCH__/${{ matrix.arch }}/" \
              -e "s/__VERSION__/$VERSION/" \
              -e "s|__SRC__|$GITHUB_WORKSPACE/build/fpm-monitor-${{ matrix.target }}|" \
              nfpm.yaml > /tmp/nfpm.yaml
      - name: Build packages
        run: |
          mkdir -p dist
          nfpm package --packager deb --config /tmp/nfpm.yaml --target dist/
          nfpm package --packager rpm --config /tmp/nfpm.yaml --target dist/
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  formula:
    name: Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate formula
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_ARM=$(shasum -a 256 artifacts/fpm-monitor-aarch64-apple-darwin | cut -d' ' -f1)
          SHA_INTEL=$(shasum -a 256 artifacts/fpm-monitor-x86_64-apple-darwin | cut -d' ' -f1)
          sed -e "s/__VERSION__/$VERSION/" \
              -e "s|__URL_ARM__|https://github.com/filoucrackeur/fpm-monitor/releases/download/${GITHUB_REF_NAME}/fpm-monitor-aarch64-apple-darwin|" \
              -e "s/__SHA_ARM__/$SHA_ARM/" \
              -e "s|__URL_INTEL__|https://github.com/filoucrackeur/fpm-monitor/releases/download/${GITHUB_REF_NAME}/fpm-monitor-x86_64-apple-darwin|" \
              -e "s/__SHA_INTEL__/$SHA_INTEL/" \
              Formula/fpm-monitor.rb > fpm-monitor.rb
          echo "--- generated formula ---"
          cat fpm-monitor.rb
      - name: Upload formula
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: fpm-monitor.rb
          if-no-files-found: error

  update-tap:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ secrets.TAP_TOKEN != '' }}
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v7
        with:
          repository: filoucrackeur/homebrew-fpm-monitor
          token: ${{ secrets.TAP_TOKEN }}
      - name: Checkout source (template)
        uses: actions/checkout@v7
        with:
          path: src
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate formula
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_ARM=$(shasum -a 256 artifacts/fpm-monitor-aarch64-apple-darwin | cut -d' ' -f1)
          SHA_INTEL=$(shasum -a 256 artifacts/fpm-monitor-x86_64-apple-darwin | cut -d' ' -f1)
          sed -e "s/__VERSION__/$VERSION/" \
              -e "s|__URL_ARM__|https://github.com/filoucrackeur/fpm-monitor/releases/download/${GITHUB_REF_NAME}/fpm-monitor-aarch64-apple-darwin|" \
              -e "s/__SHA_ARM__/$SHA_ARM/" \
              -e "s|__URL_INTEL__|https://github.com/filoucrackeur/fpm-monitor/releases/download/${GITHUB_REF_NAME}/fpm-monitor-x86_64-apple-darwin|" \
              -e "s/__SHA_INTEL__/$SHA_INTEL/" \
              src/Formula/fpm-monitor.rb > Formula/fpm-monitor.rb
          echo "--- generated tap formula ---"
          cat Formula/fpm-monitor.rb
      - name: Commit and push
        shell: bash
        run: |
          git add Formula/fpm-monitor.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, skipping commit."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Update formula for ${GITHUB_REF_NAME}"
            git push origin "$(git branch --show-current)"
          fi

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/filoucrackeur/fpm-monitor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub Release
    needs: [build, package, formula]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Inspect artifacts
        run: ls -la artifacts/
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: fpm-monitor ${{ github.ref_name }}
          body: |
            ## fpm-monitor ${{ github.ref_name }}

            ### Binaries
            - `x86_64-unknown-linux-musl` — Linux x86_64 (static)
            - `aarch64-unknown-linux-musl` — Linux ARM64 (static, e.g. `php:8.x-fpm-alpine` on ARM)
            - `aarch64-apple-darwin` — macOS Apple Silicon
            - `x86_64-apple-darwin` — macOS Intel
            - `x86_64-pc-windows-msvc.exe` — Windows x86_64

            ### Linux packages
            - `fpm-monitor_<version>_amd64.deb` / `.rpm` — Red Hat, Fedora, Debian, Ubuntu (x86_64)
            - `fpm-monitor_<version>_arm64.deb` / `.rpm` — Red Hat, Fedora, Debian, Ubuntu (ARM64)

            ### Homebrew
            ```sh
            brew install https://github.com/filoucrackeur/fpm-monitor/releases/download/${{ github.ref_name }}/fpm-monitor.rb
            ```

            ### Docker
            ```sh
            docker pull ghcr.io/filoucrackeur/fpm-monitor:${{ github.ref_name }}
            docker run --rm --pid=host -v /etc/php-fpm.d:/etc/php-fpm.d:ro \
              ghcr.io/filoucrackeur/fpm-monitor:${{ github.ref_name }} -t
            ```

            ### Checksums
            See the attached binaries; verify with `shasum -a 256`.
          files: |
            artifacts/*
            LICENSE
            README.md
          generate_release_notes: true
