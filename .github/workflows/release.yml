name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — static musl where Rust ships a prebuilt std.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            zig: true
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            zig: true
          - os: ubuntu-latest
            target: armv5te-unknown-linux-musleabi
            zig: true
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: i586-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: powerpc64-unknown-linux-musl
            zig: true
          # Linux — glibc targets without a musl prebuilt std.
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: sparc64-unknown-linux-gnu
            zig: true
          # macOS.
          - os: macos-latest
            target: aarch64-apple-darwin
            zig: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            zig: false
          # Windows.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false
          - os: windows-latest
            target: i686-pc-windows-msvc
            zig: false
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            zig: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig
        if: matrix.zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked
      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build (cross)
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test (native)
        if: ${{ !matrix.zig }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/fpm-monitor"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --help > /dev/null
          "$bin" --lang fr --help > /dev/null
          "$bin" --mock --no-color > mock.txt
          grep -q www mock.txt
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/stage"
          src="target/${{ matrix.target }}/release/fpm-monitor"
          if [ -f "$src.exe" ]; then
            cp "$src.exe" "$GITHUB_WORKSPACE/stage/fpm-monitor-${{ matrix.target }}.exe"
          else
            cp "$src" "$GITHUB_WORKSPACE/stage/fpm-monitor-${{ matrix.target }}"
          fi
          file "$GITHUB_WORKSPACE/stage/"* || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fpm-monitor-${{ matrix.target }}
          path: stage
          if-no-files-found: error

  package:
    name: Package (deb/rpm, ${{ matrix.deb }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            deb: amd64
            rpm: x86_64
          - target: aarch64-unknown-linux-musl
            arch: arm64
            deb: arm64
            rpm: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
            deb: armhf
            rpm: armv7hl
          - target: i686-unknown-linux-musl
            arch: 386
            deb: i386
            rpm: i386
          - target: riscv64gc-unknown-linux-musl
            arch: riscv64
            deb: riscv64
            rpm: riscv64
          - target: powerpc64le-unknown-linux-musl
            arch: ppc64le
            deb: ppc64el
            rpm: ppc64le
          - target: powerpc64-unknown-linux-musl
            arch: ppc64
            deb: ppc64
            rpm: ppc64
          - target: s390x-unknown-linux-gnu
            arch: s390x
            deb: s390x
            rpm: s390x
          - target: loongarch64-unknown-linux-gnu
            arch: loong64
            deb: loong64
            rpm: loongarch64
          - target: sparc64-unknown-linux-gnu
            arch: sparc64
            deb: sparc64
            rpm: sparc64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: fpm-monitor-${{ matrix.target }}
          path: build
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Generate nfpm config
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -e "s/__ARCH__/${{ matrix.arch }}/" \
              -e "s/__DEB_ARCH__/${{ matrix.deb }}/" \
              -e "s/__RPM_ARCH__/${{ matrix.rpm }}/" \
              -e "s/__VERSION__/$VERSION/" \
              -e "s|__SRC__|$GITHUB_WORKSPACE/build/fpm-monitor-${{ matrix.target }}|" \
              nfpm.yaml > /tmp/nfpm.yaml
          cat /tmp/nfpm.yaml
      - name: Build packages
        run: |
          mkdir -p dist
          nfpm package --packager deb --config /tmp/nfpm.yaml --target dist/
          nfpm package --packager rpm --config /tmp/nfpm.yaml --target dist/
          ls -la dist
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.deb }}
          path: dist
          if-no-files-found: error

  formula:
    name: Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate formula
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_ARM=$(shasum -a 256 artifacts/fpm-monitor-aarch64-apple-darwin | cut -d' ' -f1)
          SHA_INTEL=$(shasum -a 256 artifacts/fpm-monitor-x86_64-apple-darwin | cut -d' ' -f1)
          sed -e "s/__VERSION__/$VERSION/" \
              -e "s|__URL_ARM__|https://github.com/filoucrackeur/fpm-monitor/releases/download/${GITHUB_REF_NAME}/fpm-monitor-aarch64-apple-darwin|" \
              -e "s/__SHA_ARM__/$SHA_ARM/" \
              -e "s|__URL_INTEL__|https://github.com/filoucrackeur/fpm-monitor/releases/download/${GITHUB_REF_NAME}/fpm-monitor-x86_64-apple-darwin|" \
              -e "s/__SHA_INTEL__/$SHA_INTEL/" \
              Formula/fpm-monitor.rb > fpm-monitor.rb
          echo "--- generated formula ---"
          cat fpm-monitor.rb
      - name: Upload formula
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: fpm-monitor.rb
          if-no-files-found: error

  update-tap:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Checkout tap repository
        if: ${{ env.TAP_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: filoucrackeur/homebrew-fpm-monitor
          token: ${{ secrets.TAP_TOKEN }}
      - name: Checkout source (template)
        if: ${{ env.TAP_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          path: src
      - name: Download binaries
        if: ${{ env.TAP_TOKEN != '' }}
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate formula
        if: ${{ env.TAP_TOKEN != '' }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_ARM=$(shasum -a 256 artifacts/fpm-monitor-aarch64-apple-darwin | cut -d' ' -f1)
          SHA_INTEL=$(shasum -a 256 artifacts/fpm-monitor-x86_64-apple-darwin | cut -d' ' -f1)
          sed -e "s/__VERSION__/$VERSION/" \
              -e "s|__URL_ARM__|https://github.com/filoucrackeur/fpm-monitor/releases/download/${GITHUB_REF_NAME}/fpm-monitor-aarch64-apple-darwin|" \
              -e "s/__SHA_ARM__/$SHA_ARM/" \
              -e "s|__URL_INTEL__|https://github.com/filoucrackeur/fpm-monitor/releases/download/${GITHUB_REF_NAME}/fpm-monitor-x86_64-apple-darwin|" \
              -e "s/__SHA_INTEL__/$SHA_INTEL/" \
              src/Formula/fpm-monitor.rb > Formula/fpm-monitor.rb
          echo "--- generated tap formula ---"
          cat Formula/fpm-monitor.rb
      - name: Commit and push
        if: ${{ env.TAP_TOKEN != '' }}
        shell: bash
        run: |
          git add Formula/fpm-monitor.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, skipping commit."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Update formula for ${GITHUB_REF_NAME}"
            git push origin "$(git branch --show-current)"
          fi

  docker:
    name: Docker image (GHCR, 4 architectures)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/filoucrackeur/fpm-monitor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub Release
    needs: [build, package, formula]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Inspect artifacts
        run: ls -la artifacts/
      - name: Generate checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > /tmp/SHA256SUMS
          mv /tmp/SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: fpm-monitor ${{ github.ref_name }}
          body: |
            ## fpm-monitor ${{ github.ref_name }}

            ### Static Linux binaries (musl)
            - `x86_64-unknown-linux-musl` — amd64
            - `aarch64-unknown-linux-musl` — arm64
            - `armv7-unknown-linux-musleabihf` — armv7 (32-bit hard-float)
            - `arm-unknown-linux-musleabihf` — armv6 (32-bit hard-float)
            - `armv5te-unknown-linux-musleabi` — armv5 (32-bit soft-float)
            - `i686-unknown-linux-musl` — 386
            - `i586-unknown-linux-musl` — i586
            - `riscv64gc-unknown-linux-musl` — riscv64
            - `powerpc64le-unknown-linux-musl` — ppc64le
            - `powerpc64-unknown-linux-musl` — ppc64 (big-endian)

            ### Linux glibc binaries
            - `s390x-unknown-linux-gnu` — s390x
            - `loongarch64-unknown-linux-gnu` — loong64
            - `sparc64-unknown-linux-gnu` — sparc64

            ### macOS
            - `aarch64-apple-darwin` — Apple Silicon
            - `x86_64-apple-darwin` — Intel

            ### Windows
            - `x86_64-pc-windows-msvc.exe` — Windows x86_64
            - `i686-pc-windows-msvc.exe` — Windows x86 (32-bit)
            - `aarch64-pc-windows-msvc.exe` — Windows on ARM64

            ### Linux packages
            `.deb` and `.rpm` packages are provided for amd64, arm64, armhf,
            i386, riscv64, ppc64el, ppc64, s390x, loong64 and sparc64.

            ### Homebrew
            ```sh
            brew install https://github.com/filoucrackeur/fpm-monitor/releases/download/${{ github.ref_name }}/fpm-monitor.rb
            ```

            ### Docker
            A multi-arch image is published for `linux/amd64`, `linux/arm64`,
            `linux/ppc64le` and `linux/riscv64`:
            ```sh
            docker pull ghcr.io/filoucrackeur/fpm-monitor:${{ github.ref_name }}
            docker run --rm --pid=host -v /etc/php-fpm.d:/etc/php-fpm.d:ro \
              ghcr.io/filoucrackeur/fpm-monitor:${{ github.ref_name }} -t
            ```

            ### Checksums
            Verify the attached files with `sha256sum -c SHA256SUMS`.
          files: |
            artifacts/*
            LICENSE
            README.md
          generate_release_notes: true
