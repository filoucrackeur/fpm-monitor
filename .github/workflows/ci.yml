name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-targets

  musl:
    name: Cross-compile musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
      - name: Set up zig-cc linker
        run: |
          printf '#!/bin/sh\nexec zig cc "$@"\n' | sudo tee /usr/local/bin/zig-cc > /dev/null
          sudo chmod +x /usr/local/bin/zig-cc
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Build (aarch64 musl)
        run: cargo build --release --target aarch64-unknown-linux-musl
      - name: Build (x86_64 musl)
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Smoke test (x86_64)
        run: |
          ./target/x86_64-unknown-linux-musl/release/fpm-monitor --help | head -1
          ./target/x86_64-unknown-linux-musl/release/fpm-monitor --lang fr --help | head -1
