name: CI

on:
  push:
    branches: ["**", "!badges"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: MSRV (Rust 1.78)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust 1.78
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.78"
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked --all-targets

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked --all-targets

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info --fail-under-lines 75
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
      # Publish the line-coverage percentage to a `badges` branch, read by the
      # shields.io endpoint badge in the READMEs. No third-party account or
      # secret is required.
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          pct=$(python3 - <<'PY'
          import sys
          found = hit = 0
          for line in open("lcov.info", encoding="utf-8"):
              if line.startswith("LF:"):
                  found += int(line[3:])
              elif line.startswith("LH:"):
                  hit += int(line[3:])
          print(f"{100 * hit / found:.1f}" if found else "0.0")
          PY
          )
          color=$(python3 -c "p=float('$pct'); print('brightgreen' if p>=90 else 'green' if p>=80 else 'yellowgreen' if p>=70 else 'yellow' if p>=60 else 'orange' if p>=50 else 'red')")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badge-tmp
          git rm -rf . > /dev/null
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > coverage.json
          git add coverage.json
          git commit -m "Update coverage badge: ${pct}%"
          git push --force origin HEAD:badges
          echo "Coverage: ${pct}% (${color})"

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — static musl where Rust ships a prebuilt std.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            zig: true
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            zig: true
          - os: ubuntu-latest
            target: armv5te-unknown-linux-musleabi
            zig: true
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: i586-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: powerpc64-unknown-linux-musl
            zig: true
          # Linux — glibc targets without a musl prebuilt std.
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: sparc64-unknown-linux-gnu
            zig: true
          # macOS.
          - os: macos-15
            target: aarch64-apple-darwin
            zig: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            zig: false
          # Windows.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false
          - os: windows-latest
            target: i686-pc-windows-msvc
            zig: false
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            zig: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig
        if: matrix.zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Build (cross)
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test (native)
        if: ${{ !matrix.zig }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/fpm-monitor"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --help > /dev/null
          "$bin" --lang fr --help > /dev/null
          "$bin" --mock --no-color > mock.txt
          grep -q www mock.txt
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p stage
          src="target/${{ matrix.target }}/release/fpm-monitor"
          if [ -f "$src.exe" ]; then
            cp "$src.exe" "stage/fpm-monitor-${{ matrix.target }}.exe"
          else
            cp "$src" "stage/fpm-monitor-${{ matrix.target }}"
          fi
          file "stage/"* || true
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpm-monitor-${{ matrix.target }}
          path: stage
          if-no-files-found: error

  packaging:
    name: Packaging (archives + deb/rpm)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Build archives and packages
        run: |
          scripts/release-artifacts.sh 0.0.0 bin dist
          scripts/build-packages.sh 0.0.0 bin dist
      - name: Verify artifact count
        run: |
          archives=$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          packages=$(find dist -maxdepth 1 \( -name '*.deb' -o -name '*.rpm' \) | wc -l)
          echo "archives=$archives packages=$packages"
          [ "$archives" -ge 18 ] || { echo "expected at least 18 archives, got $archives" >&2; exit 1; }
          [ "$packages" -ge 22 ] || { echo "expected at least 22 packages, got $packages" >&2; exit 1; }
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-dist
          path: dist
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
            image: alpine:3.24
            container: true
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
            image: alpine:3.24
            container: true
          - target: armv7-unknown-linux-musleabihf
            platform: linux/arm/v7
            image: alpine:3.24
            container: true
          - target: arm-unknown-linux-musleabihf
            platform: linux/arm/v6
            image: alpine:3.24
            container: true
          - target: i686-unknown-linux-musl
            platform: linux/386
            image: alpine:3.24
            container: true
          - target: riscv64gc-unknown-linux-musl
            platform: linux/riscv64
            image: alpine:3.24
            container: true
          - target: powerpc64le-unknown-linux-musl
            platform: linux/ppc64le
            image: alpine:3.24
            container: true
          - target: s390x-unknown-linux-gnu
            platform: linux/s390x
            image: debian:stable-slim
            container: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: fpm-monitor-${{ matrix.target }}
          path: smoke
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Run binary under QEMU
        run: |
          chmod +x "smoke/fpm-monitor-${{ matrix.target }}"
          img="${{ matrix.image }}"
          plat="${{ matrix.platform }}"
          bin="/smoke/fpm-monitor-${{ matrix.target }}"
          docker run --rm --platform "$plat" -v "$PWD/smoke:/smoke:ro" "$img" "$bin" --help > /dev/null
          docker run --rm --platform "$plat" -v "$PWD/smoke:/smoke:ro" "$img" "$bin" --lang fr --help > /dev/null
          docker run --rm --platform "$plat" -v "$PWD/smoke:/smoke:ro" "$img" "$bin" --mock --no-color > mock.txt
          grep -q www mock.txt

  docker:
    name: Docker image (multi-arch build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/riscv64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
