name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: MSRV (Rust 1.78)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust 1.78
        uses: dtolnay/rust-toolchain@1.78
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked --all-targets

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked --all-targets

  coverage:
    name: Coverage (llvm-cov + Codecov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --locked --all-targets --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — static musl where Rust ships a prebuilt std.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            zig: true
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
            zig: true
          - os: ubuntu-latest
            target: armv5te-unknown-linux-musleabi
            zig: true
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: i586-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: powerpc64-unknown-linux-musl
            zig: true
          # Linux — glibc targets without a musl prebuilt std.
          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: sparc64-unknown-linux-gnu
            zig: true
          # macOS.
          - os: macos-latest
            target: aarch64-apple-darwin
            zig: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            zig: false
          # Windows.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zig: false
          - os: windows-latest
            target: i686-pc-windows-msvc
            zig: false
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            zig: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig
        if: matrix.zig
        uses: goto-bus-stop/setup-zig@v2
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Build (cross)
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test (native)
        if: ${{ !matrix.zig }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/fpm-monitor"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --help > /dev/null
          "$bin" --lang fr --help > /dev/null
          "$bin" --mock --no-color | grep -q www
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p stage
          src="target/${{ matrix.target }}/release/fpm-monitor"
          if [ -f "$src.exe" ]; then
            cp "$src.exe" "stage/fpm-monitor-${{ matrix.target }}.exe"
          else
            cp "$src" "stage/fpm-monitor-${{ matrix.target }}"
          fi
          file "stage/"* || true
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fpm-monitor-${{ matrix.target }}
          path: stage
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
            image: alpine:3.22
            container: true
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
            image: alpine:3.22
            container: true
          - target: armv7-unknown-linux-musleabihf
            platform: linux/arm/v7
            image: alpine:3.22
            container: true
          - target: arm-unknown-linux-musleabihf
            platform: linux/arm/v6
            image: alpine:3.22
            container: true
          - target: i686-unknown-linux-musl
            platform: linux/386
            image: alpine:3.22
            container: true
          - target: riscv64gc-unknown-linux-musl
            platform: linux/riscv64
            image: alpine:3.22
            container: true
          - target: powerpc64le-unknown-linux-musl
            platform: linux/ppc64le
            image: alpine:3.22
            container: true
          - target: s390x-unknown-linux-gnu
            platform: linux/s390x
            image: debian:stable-slim
            container: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: fpm-monitor-${{ matrix.target }}
          path: smoke
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Run binary under QEMU
        run: |
          chmod +x "smoke/fpm-monitor-${{ matrix.target }}"
          img="${{ matrix.image }}"
          plat="${{ matrix.platform }}"
          bin="/smoke/fpm-monitor-${{ matrix.target }}"
          docker run --rm --platform "$plat" -v "$PWD/smoke:/smoke:ro" "$img" "$bin" --help > /dev/null
          docker run --rm --platform "$plat" -v "$PWD/smoke:/smoke:ro" "$img" "$bin" --lang fr --help > /dev/null
          docker run --rm --platform "$plat" -v "$PWD/smoke:/smoke:ro" "$img" "$bin" --mock --no-color | grep -q www

  docker:
    name: Docker image (multi-arch build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/riscv64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
