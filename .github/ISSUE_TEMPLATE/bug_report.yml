name: Bug report
description: Report a reproducible problem with fpm-monitor
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the existing
        issues first and fill in as much detail as you can. Do **not** include
        passwords, tokens, private keys, or personal data in logs.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and discussions.
          required: true
        - label: I reproduced the problem on the latest release or on `main`.
          required: true
        - label: This is not a security issue. Security reports follow SECURITY.md.
          required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, or the output of `git rev-parse --short HEAD`.
      placeholder: "v1.2.1 or 9f691fb"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - FreeBSD / OpenBSD / NetBSD / DragonFly
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: Architecture
      description: For example x86_64, aarch64, armv7, or i686.
      placeholder: "x86_64"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Prebuilt archive or raw binary
        - Homebrew
        - .deb or .rpm package
        - Docker image
        - Built from source
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: php_fpm
    attributes:
      label: PHP-FPM version
      description: The PHP version and pool configuration, if the bug involves live data.
      placeholder: "PHP 8.3, www pool"

  - type: textarea
    id: command
    attributes:
      label: Command and options
      description: The exact command that triggers the problem.
      placeholder: "fpm-monitor --watch --interval 1"
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the full error message if there is one.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest reliable reproduction. `--mock` is ideal for interface bugs.
      placeholder: |
        1. Run `fpm-monitor --mock --watch`
        2. Open http://127.0.0.1:8471
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output, redacted if needed. Drag images into this field.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help, such as a config snippet or a recent change.
