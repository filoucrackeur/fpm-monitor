name: Feature request
description: Suggest a new capability or an improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the problem first,
        then the solution you have in mind. Small, focused proposals are easier
        to discuss and review.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and discussions.
          required: true
        - label: This is a single, focused proposal.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI output
        - TUI dashboard
        - Web dashboard
        - Graphs or logs
        - Configuration discovery
        - Languages and translations
        - Documentation
        - Packaging or releases
        - Performance or portability
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
      placeholder: "When I monitor several pools, I cannot ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or tools you have tried.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, examples from other tools, or links to related issues.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help test this change.
        - label: I am willing to open a pull request for this change.
